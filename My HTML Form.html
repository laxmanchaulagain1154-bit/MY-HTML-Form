</head>
<body>
<form action="/action_page.php">
  <div class="Form-Container">

</div>

<label for="Email">Email:</label>
 <input type="text" id="Email" name="Email" placeholder="Enter your Email Here"><br><br>

<label for="Password">Password:</label>
<input type="password"id="UserPassword" name="UserPassword" placeholder="Your Password"><br><br>

   <label for="Message">Message:</label>
   <input type="text" id="Message" name="Message" placeholder="Enter your Text Here" title="Password must contain at least one letter and one number."
    ><br><br>
   
  </div>

  <div>
    <button type="Submit">Submit:</button>
  </div>
  </form>
